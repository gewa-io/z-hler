<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gerätezähler</title>

<style>
* {
    box-sizing: border-box;
    font-family: Inter, Arial, sans-serif;
}

body {
    margin: 0;
    background: #f2f4f7;
    color: #1f2937;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

.header {
    background: #12355b;
    color: white;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.counter {
    text-align: center;
}

.counter span {
    display: block;
    font-size: 70px;
    font-weight: bold;
    color: #12355b;
}

.label {
    color: #6b7280;
    font-size: 18px;
}

input {
    width: 100%;
    padding: 18px;
    font-size: 22px;
    border-radius: 10px;
    border: 2px solid #d1d5db;
    outline: none;
}

input:focus {
    border-color: #12355b;
}

.status {
    margin-top: 15px;
    padding: 15px;
    border-radius: 10px;
    background: #e5e7eb;
    font-size: 18px;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.stat {
    flex: 1;
    min-width: 200px;
    background: #f8fafc;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 30px;
    color: #12355b;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #12355b;
    color: white;
    padding: 12px;
}

td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

.search {
    margin-bottom: 15px;
}

button {
    padding: 14px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-right: 10px;
    font-size: 16px;
}

.primary {
    background: #12355b;
    color: white;
}

.danger {
    background: #b91c1c;
    color: white;
}

.secondary {
    background: #6b7280;
    color: white;
}

@media(max-width:700px){
    .counter span {
        font-size:50px;
    }
}
</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>Gerätezähler</h1>
</div>


<div class="card counter">
<div class="label">Gesamt erfasste Geräte</div>
<span id="total">0</span>
</div>


<div class="card">

<h2>Scanner</h2>

<input 
id="scanner"
placeholder="Gerätenummer scannen..."
autocomplete="off">

<div id="status" class="status">
Bereit zum Scannen.
</div>

</div>


<div class="card">

<div class="stats">

<div class="stat">
<strong id="today">0</strong>
Heute gescannt
</div>

<div class="stat">
<strong id="duplicates">0</strong>
Doppelte Scans
</div>

<div class="stat">
<strong id="last">-</strong>
Letzter Scan
</div>

</div>

</div>


<div class="card">

<h2>Gespeicherte Geräte</h2>

<input 
class="search"
id="search"
placeholder="Gerätenummer suchen...">


<table>

<thead>
<tr>
<th>Gerätenummer</th>
<th>Zeitpunkt</th>
</tr>
</thead>

<tbody id="list"></tbody>

</table>

</div>


<div class="card">

<button class="primary" onclick="exportCSV()">
CSV Export
</button>

<button class="danger" onclick="clearAll()">
Liste löschen
</button>

</div>


</div>


<script>

let devices = JSON.parse(localStorage.getItem("devices")) || [];
let duplicates = Number(localStorage.getItem("duplicates")) || 0;


const scanner = document.getElementById("scanner");
const status = document.getElementById("status");


function save(){
    localStorage.setItem("devices", JSON.stringify(devices));
    localStorage.setItem("duplicates", duplicates);
}


function update(){

    document.getElementById("total").innerText = devices.length;
    document.getElementById("duplicates").innerText = duplicates;

    document.getElementById("today").innerText =
    devices.filter(d => 
        new Date(d.time).toDateString() === new Date().toDateString()
    ).length;


    document.getElementById("last").innerText =
    devices.length ? devices[devices.length-1].number : "-";


    render();

}


function scan(number){

    number = number.trim();

    if(!number) return;


    let exists = devices.some(d => d.number === number);


    if(exists){

        duplicates++;

        status.className="status error";
        status.innerText =
        "Diese Gerätenummer wurde bereits erfasst.";

    } else {


        devices.push({

            number:number,
            time:new Date().toLocaleString("de-DE")

        });


        status.className="status success";
        status.innerText =
        "Gerät erfolgreich hinzugefügt.";

    }


    save();
    update();


    scanner.value="";
    scanner.focus();

}



scanner.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        scan(scanner.value);

    }

});


function render(){

    let search =
    document.getElementById("search").value.toLowerCase();


    let html="";


    [...devices]
    .reverse()
    .filter(d =>
        d.number.toLowerCase().includes(search)
    )
    .forEach(d=>{


        html += `
        <tr>
        <td>${d.number}</td>
        <td>${d.time}</td>
        </tr>
        `;


    });


    document.getElementById("list").innerHTML=html;

}


document.getElementById("search")
.addEventListener("input",render);



function exportCSV(){

    let csv="Gerätenummer;Zeitpunkt\n";


    devices.forEach(d=>{

        csv += `${d.number};${d.time}\n`;

    });


    let blob=new Blob([csv],
    {type:"text/csv"});


    let url=URL.createObjectURL(blob);


    let a=document.createElement("a");

    a.href=url;
    a.download="geraete.csv";
    a.click();

}



function clearAll(){

    if(confirm("Alle Geräte wirklich löschen?")){

        devices=[];
        duplicates=0;
        save();
        update();

    }

}



update();

scanner.focus();

</script>

</body>
</html>
